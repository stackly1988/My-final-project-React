  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  color: #222;
}

.navbar {
  background: #222;
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.nav-links a {
  color: white;
  text-decoration: none;
}

.nav-links a.active {
  color: #00d4ff;
}

.cart {
  font-weight: bold;
}

.hero {
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
}

.hero h1 {
  font-size: 50px;
  margin-bottom: 15px;
}

.hero p {
  font-size: 20px;
  margin-bottom: 30px;
}

.hero-btn,
.details-btn {
  display: inline-block;
  text-decoration: none;
  background: #2563eb;
  color: white;
  padding: 12px 20px;
  border-radius: 6px;
}

.page {
  width: 90%;
  max-width: 1200px;
  margin: 40px auto;
}

.page h1 {
  margin-bottom: 25px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
}

.product-card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
}

.product-card img {
  width: 100%;
  height: 220px;
  object-fit: contain;
}

.product-card h3 {
  margin: 15px 0;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.card-buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  flex-wrap: wrap;
}

button {
  border: none;
  background: #16a34a;
  color: white;
  padding: 12px 18px;
  border-radius: 6px;
  cursor: pointer;
}

.details {
  width: 90%;
  max-width: 1000px;
  margin: 50px auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  background: white;
  padding: 40px;
  border-radius: 12px;
}

.details img {
  width: 100%;
  height: 400px;
  object-fit: contain;
}

.details p {
  line-height: 1.7;
  margin: 20px 0;
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.service-card {
  background: white;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
}

.service-card h2 {
  margin-bottom: 15px;
}

.service-card p {
  margin-bottom: 20px;
}

.service-card a {
  color: #2563eb;
  text-decoration: none;
}

.contact form {
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input,
textarea {
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

textarea {
  height: 150px;
  resize: vertical;
}

.loader {
  text-align: center;
  margin-top: 100px;
  font-size: 25px;
}

.error {
  text-align: center;
  color: red;
  margin-top: 50px;
}

.not-found {
  text-align: center;
}

.not-found h1 {
  font-size: 100px;
}

@media (max-width: 700px) {
  .navbar {
    flex-direction: column;

    justify-content: center;
  }

    font-size: 35px;
  }

  .details {
    grid-template-columns: 1fr;
  }
